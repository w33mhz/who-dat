<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Dat?</title>
<style>
:root{--bg:#fff8ec;--fg:#2b2340;--card:#fff;--line:#e4d6bd;--acc:#7c4dff;--accfg:#fff;--ok:#12814a;--bad:#c93a46;--mut:#6b6280;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17132b;--fg:#f3eefc;--card:#262042;--line:#3d3560;--acc:#a98bff;--accfg:#17132b;--ok:#4fd18b;--bad:#ff7b86;--mut:#aaa2c6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#17132b;--fg:#f3eefc;--card:#262042;--line:#3d3560;--acc:#a98bff;--accfg:#17132b;--ok:#4fd18b;--bad:#ff7b86;--mut:#aaa2c6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1040px;margin:0 auto;padding:12px}
h1{margin:0 0 8px;font-size:1.6rem}h2{margin:0 0 8px;font-size:1rem}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,select{font:inherit}
button.act,button.q{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.85rem}
button.act{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
button.act.alt{background:var(--bg);color:var(--fg);border-color:var(--line)}
button.q.hl{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.packs label{border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center;cursor:pointer}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.main{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:840px){.main{grid-template-columns:1fr 320px}}
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;color:var(--fg);font:inherit;cursor:pointer;transition:transform .35s,opacity .35s}
.card b{font-size:2.3rem;line-height:1.1}.card span{font-size:.72rem;font-weight:600;text-align:center}
.card.out{opacity:.38;filter:grayscale(1);transform:scaleY(.88) translateY(6px);border-style:dashed}
.card.out::after{content:"OUT";position:absolute;top:3px;left:5px;font-size:.6rem;font-weight:800;color:var(--bad)}
#board.g .card:not(.out){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.badge{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:1.2rem}
.card.yes{animation:hop .6s ease 2;border-color:var(--ok)}.card.no{animation:nope .5s;border-color:var(--bad)}
@keyframes hop{50%{transform:translateY(-10px) rotate(-6deg)}}@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.calm .card{animation:none!important;transition:none}
@media(prefers-reduced-motion:reduce){.card{animation:none!important;transition:none}}
#qs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#ans{min-height:2em;font-size:1.2rem;font-weight:800}#ans.y{color:var(--ok)}#ans.n{color:var(--bad)}
#hint{font-size:.85rem;color:var(--mut);min-height:2.4em;margin-top:8px}
#log{margin:0;padding-left:18px;font-size:.82rem;max-height:150px;overflow:auto}
.ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:5;text-align:center}
.ov.on{display:flex}.ov p{font-size:1.2rem;font-weight:700}
.hide{display:none}
</style></head>
<body><div class="wrap">
<h1>🕵️ Who Dat?</h1>
<section id="setup">
 <div class="panel"><h2>1. Choose character packs (mix as many as you like)</h2><div class="packs" id="packs"></div><div class="err" id="err"></div></div>
 <div class="panel"><h2>2. Choose how to play</h2><div class="row">
  <label>Opponent <select id="mode"><option value="cpu">Computer</option><option value="2p">Second player (pass the device)</option></select></label>
  <label id="dl">Computer <select id="diff"><option value="easy">Beginner</option><option value="hard">Clever</option></select></label></div>
  <div class="row"><label><input type="checkbox" id="auto"> Auto-eliminate</label><label><input type="checkbox" id="calm"> Calm motion</label><label><input type="checkbox" id="speak"> Read answers aloud</label></div></div>
 <button class="act" id="start">Start game</button>
</section>
<section id="game" class="hide">
 <div class="row" style="margin:0 0 6px"><b id="who"></b><span id="secret" class="panel" style="margin:0;padding:4px 10px"></span></div>
 <div id="status" aria-live="polite" style="font-weight:600"></div><div id="ans" aria-live="assertive"></div>
 <div class="main"><div id="board" role="group" aria-label="Character board"></div>
 <aside><div class="panel"><h2>Ask a question</h2><div id="qs"></div>
  <div class="row"><button class="act alt" id="hintBtn">💡 Hint</button><button class="act" id="guessBtn">I know who!</button></div><div id="hint"></div></div>
 <div class="panel"><h2>History</h2><ol id="log"></ol></div>
 <button class="act alt" id="menu">⚙ Setup / new game</button></aside></div>
</section></div>
<div class="ov" id="pass" role="dialog" aria-modal="true"><div><p id="passMsg"></p><button class="act" id="ready">I'm ready</button></div></div>
<div class="ov" id="end" role="dialog" aria-modal="true"><div><p id="endMsg"></p><button class="act" id="again">Play again</button></div></div>
<script type="module">
import {PACKS,Q,R} from "./src/data.js";
import {has,questionsFor,rank,filter,resolve,reactionEvents,validatePack} from "./src/engine.js";
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
let cfg={packs:["funny","fantasy","animals","food"],mode:"cpu",diff:"easy",auto:true,calm:false,speak:false};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("whodat-cfg")||"{}"))}catch{}
const save=()=>{try{localStorage.setItem("whodat-cfg",JSON.stringify(cfg))}catch{}};
const say=t=>{if(cfg.speak&&window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}};
const label=k=>Q[k].replace("Does your character ","").replace("Is your character ","Is ").replace("?","")+"?";
const chars=()=>PACKS.filter(p=>cfg.packs.includes(p.id)).flatMap(p=>p.chars);
// ---- setup ----
$("#packs").innerHTML=PACKS.map(p=>`<label><input type="checkbox" value="${p.id}"> <span>${p.emoji} ${p.name} (${p.chars.length})</span></label>`).join("");
function syncSetup(){
 document.querySelectorAll("#packs input").forEach(i=>i.checked=cfg.packs.includes(i.value));
 $("#mode").value=cfg.mode;$("#diff").value=cfg.diff;$("#auto").checked=cfg.auto;$("#calm").checked=cfg.calm;$("#speak").checked=cfg.speak;
 $("#dl").classList.toggle("hide",cfg.mode!=="cpu");document.body.classList.toggle("calm",cfg.calm);
 const c=chars(),iss=validatePack(c,questionsFor(c,Q));$("#err").textContent=iss.join(" ");$("#start").disabled=!!iss.length;}
$("#packs").onchange=()=>{cfg.packs=[...document.querySelectorAll("#packs input:checked")].map(i=>i.value);save();syncSetup()};
for(const [id,key] of [["mode","mode"],["diff","diff"]])$("#"+id).onchange=e=>{cfg[key]=e.target.value;save();syncSetup()};
for(const k of ["auto","calm","speak"])$("#"+k).onchange=e=>{cfg[k]=e.target.checked;save();syncSetup()};
// ---- game ----
let S,C,keys;
function start(){
 C=chars();keys=questionsFor(C,Q);const all=C.map((_,i)=>i),a=rnd(C.length);let b;do b=rnd(C.length);while(b===a&&C.length>1);
 const mk=(name,secret,cpu)=>({name,secret,cpu,cand:[...all],out:new Set(),asked:[],log:[]});
 S={p:[mk("Player 1",a,false),mk(cfg.mode==="cpu"?"Computer":"Player 2",b,cfg.mode==="cpu")],turn:0,view:0,busy:false,guess:false,over:false,hl:null};
 $("#setup").classList.add("hide");$("#game").classList.remove("hide");$("#end").classList.remove("on");$("#ans").textContent="";$("#hint").textContent="";
 if(cfg.mode==="2p")handoff();else render();
}
function handoff(){S.view=S.turn;$("#passMsg").textContent=`Pass the device to ${S.p[S.turn].name}. Don't peek, ${S.p[1-S.turn].name}!`;$("#pass").classList.add("on");$("#ans").textContent="";$("#hint").textContent="";render();$("#ready").focus()}
$("#ready").onclick=()=>$("#pass").classList.remove("on");
function render(){
 const v=S.p[S.view],mine=!S.busy&&!S.over&&!v.cpu&&S.turn===S.view;
 $("#who").textContent=cfg.mode==="2p"?v.name:"You";$("#secret").innerHTML=`Your secret: <b>${C[v.secret].e}</b> ${C[v.secret].n}`;
 $("#board").className=S.guess?"g":"";
 $("#board").innerHTML=C.map((c,i)=>`<button class="card${v.out.has(i)?" out":""}" data-i="${i}" aria-label="${c.n}${v.out.has(i)?", eliminated":""}"><b>${c.e}</b><span>${c.n}</span><i class="badge"></i></button>`).join("");
 $("#qs").innerHTML=keys.map(k=>`<button class="q${S.hl===k?" hl":""}" data-k="${k}" ${!mine||v.asked.includes(k)?"disabled":""}>${label(k)}</button>`).join("");
 $("#hintBtn").disabled=!mine;$("#guessBtn").disabled=!mine;$("#guessBtn").textContent=S.guess?"Cancel guess":"I know who!";
 $("#log").innerHTML=v.log.map(l=>`<li>${l}</li>`).join("");
 $("#status").textContent=S.over?"Game over":S.guess?"Tap the character you think is your opponent's secret.":mine?`Your turn — about ${v.cand.length} possible. Ask a question or tap cards to cross them out.`:"Computer is thinking…";
}
function ask(k){
 const me=S.p[S.turn],opp=S.p[1-S.turn];if(S.busy||S.over||me.asked.includes(k))return;
 const a=resolve(C[opp.secret],k);me.asked.push(k);me.cand=filter(C,me.cand,k,a);me.log.unshift(`${label(k)} → <b>${a?"Yes":"No"}</b>`);S.hl=null;S.busy=true;
 const el=$("#ans");el.className=a?"y":"n";el.textContent=(a?"Yes! ":"No! ")+label(k);say((a?"Yes. ":"No. ")+Q[k]);render();
 for(const e of reactionEvents(C,k)){const c=$("#board").children[e.i];c.classList.add(e.match?"yes":"no");c.querySelector(".badge").textContent=e.match?R[k]:"🤷"}
 $("#hint").textContent="";
 setTimeout(()=>{if(cfg.auto&&me.cand.length)me.out=new Set(C.map((_,i)=>i).filter(i=>!me.cand.includes(i)));S.busy=false;S.turn=1-S.turn;
  if(cfg.mode==="2p")handoff();else{S.busy=true;render();setTimeout(cpu,500)}},1300);
}
function cpu(){
 const me=S.p[1],opp=S.p[0];if(S.over)return;
 const o=rank(C,me.cand,me.asked,keys);
 if(me.cand.length<=1||!o.length)return end(1,`The computer guessed ${C[opp.secret].e} ${C[opp.secret].n} — your character. Computer wins!`);
 const k=cfg.diff==="hard"?o[0].k:o[rnd(o.length)].k,a=resolve(C[opp.secret],k);
 me.asked.push(k);me.cand=filter(C,me.cand,k,a);opp.log.unshift(`🤖 ${label(k)} → <b>${a?"Yes":"No"}</b>`);
 $("#ans").className=a?"y":"n";$("#ans").textContent=`🤖 asks: ${label(k)} Answer: ${a?"Yes":"No"}`;say(`The computer asks: ${Q[k]} ${a?"Yes":"No"}`);
 S.busy=false;S.turn=0;render();
}
function end(w,msg){S.over=true;$("#endMsg").textContent=(S.p[w].cpu?"😬 ":"🎉 ")+msg;$("#end").classList.add("on");render();say(msg);$("#again").focus()}
$("#board").onclick=e=>{const c=e.target.closest(".card");if(!c||S.over||S.busy)return;const i=+c.dataset.i,v=S.p[S.view];
 if(S.guess){const me=S.p[S.turn],opp=S.p[1-S.turn],ok=i===opp.secret;return end(ok?S.turn:1-S.turn,ok?`${me.name} got it! It was ${C[i].e} ${C[i].n}.`:`Not quite — it was ${C[opp.secret].e} ${C[opp.secret].n}. ${opp.name} wins!`)}
 v.out.has(i)?v.out.delete(i):v.out.add(i);render()};
$("#qs").onclick=e=>{const b=e.target.closest("[data-k]");if(b)ask(b.dataset.k)};
$("#hintBtn").onclick=()=>{const v=S.p[S.view];if(v.cand.length===1){$("#hint").textContent="Only one character fits every answer so far — make your guess!";return}
 const b=rank(C,v.cand,v.asked,keys)[0];if(!b){$("#hint").textContent="No question splits the rest. Time to guess!";return}
 S.hl=b.k;render();$("#hint").textContent=`Try “${Q[b.k]}” — ${b.n} of ${v.cand.length} remaining would say Yes, so it should rule out about ${Math.round(Math.min(b.n,v.cand.length-b.n)/v.cand.length*100)}% or more of them.`};
$("#guessBtn").onclick=()=>{S.guess=!S.guess;render()};
$("#start").onclick=start;$("#again").onclick=start;
$("#menu").onclick=()=>{$("#game").classList.add("hide");$("#setup").classList.remove("hide");$("#pass").classList.remove("on");syncSetup()};
syncSetup();
</script></body></html>
