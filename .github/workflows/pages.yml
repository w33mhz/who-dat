name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure public Supabase client
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !accessToken) throw new Error('Supabase project configuration is missing.');

          const response = await fetch(`https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          if (!response.ok) throw new Error(`Supabase API key lookup failed with HTTP ${response.status}.`);
          const keys = await response.json();
          const publicKey = keys.find(key => key.type === 'legacy' && key.name === 'anon')?.api_key;
          if (!publicKey) throw new Error('Supabase project has no publishable or anon key.');

          const publicConfig = { url: `https://${projectRef}.supabase.co`, anonKey: publicKey };
          const marker = '<!-- SUPABASE_CONFIG -->';
          const html = await readFile('index.html', 'utf8');
          if (!html.includes(marker)) throw new Error('Supabase configuration marker is missing from index.html.');
          const script = `<script>window.WHO_DAT_SUPABASE = Object.freeze(${JSON.stringify(publicConfig)});</script>`;
          const configuredHtml = html.replace(marker, script);
          if (configuredHtml.includes(marker) || !configuredHtml.includes('window.WHO_DAT_SUPABASE = Object.freeze')) {
            throw new Error('Supabase browser configuration was not injected into index.html.');
          }
          await writeFile('index.html', configuredHtml);
          console.log('Injected browser configuration into index.html with the public key only.');
          NODE
      - name: Name the Pages artifact uniquely
        run: echo "PAGES_ARTIFACT=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
